<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — Profesional Stock</title>
  <link rel="icon" type="image/png" href="profesional-stock-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0f172a; --muted: #475569; --brand: #2563eb; --line: #e2e8f0; --sans: "DM Sans", sans-serif; --display: "Manrope", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: var(--ink); background: #f8fafc; font-family: var(--sans); text-align: center; }
    main { width: min(520px, 100%); padding: clamp(24px, 7vw, 44px); border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 18px 45px #0f172a0d; }
    .code { color: var(--brand); font: 800 14px var(--display); letter-spacing: 1px; }
    h1 { margin: 10px 0; font: 800 clamp(30px, 7vw, 42px)/1.15 var(--display); letter-spacing: -1.4px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 23px; }
    .button { min-height: 45px; display: inline-flex; align-items: center; justify-content: center; padding: 0 17px; border: 1px solid var(--brand); border-radius: 9px; color: #fff; background: var(--brand); font-size: 13px; font-weight: 700; text-decoration: none; }
    .button-light { color: var(--ink); border-color: var(--line); background: #fff; }
    a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="code">ERROR 404</span>
    <h1>Esta página no está disponible.</h1>
    <p>Puede que el enlace haya cambiado. Volvé al inicio o conocé cómo probar Profesional Stock gratis durante 15 días.</p>
    <div class="actions">
      <a class="button" href="index.html">Ir al inicio</a>
      <a class="button button-light" href="prueba.html">Probar 15 días gratis</a>
    </div>
  </main>
</body>
</html>
